openapi: 3.0.0
info:
  title: Setta Backend
  version: 0.0.0
tags:
  - name: auth
  - name: cards
  - name: expansions
  - name: users_planned
  - name: decks_planned
  - name: card_links_planned
  - name: roles_planned
  - name: token_requests_planned
paths:
  /card_links:
    post:
      operationId: CardLinks_createCardLink
      description: add card to deck
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLink'
      tags:
        - card_links_planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardLink'
    patch:
      operationId: CardLinks_updateCardLink
      description: update count of cards in deck
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLink'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - card_links_planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardLinkUpdate'
    delete:
      operationId: CardLinks_deleteCardLink
      description: remove card from deck
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - card_links_planned
  /decks:
    get:
      operationId: Decks_listDecks
      description: returns all decks user has access to
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckList'
      tags:
        - decks_planned
    post:
      operationId: Decks_createDeck
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
      tags:
        - decks_planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckCreate'
  /decks/{deckId}/:copy:
    post:
      operationId: Decks_copyDeck
      description: copies current deck with name '<deckname> (copy)'
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - decks_planned
  /decks/{userId}:
    patch:
      operationId: Decks_updateDeck
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - decks_planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckUpdate'
  /roles:
    get:
      operationId: Roles_listRoles
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
      tags:
        - roles_planned
    post:
      operationId: Roles_createRole
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
      tags:
        - roles_planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
  /roles/{roleId}:
    get:
      operationId: Roles_getRole
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - roles_planned
    post:
      operationId: Roles_updateRole
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
      tags:
        - roles_planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
    delete:
      operationId: Roles_deleteRole
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - roles_planned
  /token_requests:
    get:
      operationId: TokenRequests_listTokenRequests
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenRequest'
      tags:
        - token_requests_planned
    post:
      operationId: TokenRequests_requestTokens
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRequest'
      tags:
        - token_requests_planned
  /token_requests/{tokenRequestId}:
    delete:
      operationId: TokenRequests_deleteTokenRequest
      parameters:
        - name: tokenRequestId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - token_requests_planned
  /user/authenticate:
    post:
      operationId: Authenticate_authenticate
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /user/cards:
    get:
      operationId: Cards_listCards
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
      tags:
        - cards
  /user/expansions:
    get:
      operationId: Expansions_listExpansions
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpansionList'
      tags:
        - expansions
  /user/users:
    get:
      operationId: Users_listUsers
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - users_planned
    post:
      operationId: Users_createUser
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - users_planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /user/users/{userId}:
    get:
      operationId: Users_getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - users_planned
    patch:
      operationId: Users_updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - users_planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
    delete:
      operationId: Users_deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - users_planned
security:
  - BearerAuth: []
components:
  schemas:
    AuthResponse:
      type: object
      required:
        - authToken
        - userId
        - firstname
        - lastname
        - isAdmin
      properties:
        authToken:
          type: string
        userId:
          type: integer
          format: int32
        firstname:
          type: string
        lastname:
          type: string
        isAdmin:
          type: boolean
    Card:
      type: object
      required:
        - cardId
        - ownerId
        - image
        - prompt
        - ownerFirstname
        - ownerLastname
        - cardName
        - isAce
        - cardClass
        - cardType
        - subtype
        - supertype
        - maximumPiece
        - level
        - atk
        - def
        - costText
        - effectText
        - flavourText
        - artScale
        - artXOffset
        - artYOffset
        - nameSize
        - materialsSize
        - effectsSize
        - expansionId
        - originalExpansionId
        - createdAt
        - updatedAt
        - cardEffects
      properties:
        cardId:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        image:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          description: generated images need to be stored as array to allow multiple generations for same card
        prompt:
          type: string
        errataOfId:
          type: integer
          format: int32
        ownerFirstname:
          type: string
        ownerLastname:
          type: string
        cardName:
          type: string
        isAce:
          type: boolean
        cardClass:
          type: string
        cardType:
          type: string
        subtype:
          type: string
        supertype:
          type: string
        maximumPiece:
          type: string
        level:
          type: integer
          format: int32
        atk:
          type: integer
          format: int32
        def:
          type: integer
          format: int32
        primaryMaterialId:
          type: integer
          format: int32
        secondaryMaterialId:
          type: integer
          format: int32
        tertiaryMaterialId:
          type: integer
          format: int32
        materialsReminder:
          type: string
        costText:
          type: string
        effectText:
          type: string
        flavourText:
          type: string
        countsAsId:
          type: integer
          format: int32
        artScale:
          type: number
          format: float
        artXOffset:
          type: number
          format: float
        artYOffset:
          type: number
          format: float
        nameSize:
          type: number
          format: float
        materialsSize:
          type: number
          format: float
        effectsSize:
          type: number
          format: float
        expansionId:
          type: integer
          format: int32
        originalExpansionId:
          type: integer
          format: int32
        createdAt:
          type: string
        updatedAt:
          type: string
        cardEffects:
          $ref: '#/components/schemas/CardEffects'
    CardEffects:
      type: object
      required:
        - cost
        - effect
      properties:
        cost:
          $ref: '#/components/schemas/EffectsCost'
        effect:
          $ref: '#/components/schemas/EffectsEffect'
    CardLink:
      type: object
      required:
        - deckId
        - cardId
        - count
      properties:
        deckId:
          type: integer
          format: int32
        cardId:
          type: integer
          format: int32
        count:
          type: integer
          format: int32
    CardLinkUpdate:
      type: object
      properties:
        deckId:
          type: integer
          format: int32
        cardId:
          type: integer
          format: int32
        count:
          type: integer
          format: int32
    CardList:
      type: object
      required:
        - countOfCards
        - cards
      properties:
        countOfCards:
          type: integer
          format: int32
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
    ChainEffect:
      type: object
      required:
        - chainType
      properties:
        chainType:
          type: string
        subtype:
          type: string
        direction:
          type: string
        amount:
          type: integer
          format: int32
    Credentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    Deck:
      type: object
      required:
        - ownerId
        - formatId
        - name
        - released
        - releasedAt
        - cardsLinks
      properties:
        ownerId:
          type: integer
          format: int32
        formatId:
          type: integer
          format: int32
        name:
          type: string
        released:
          type: boolean
        releasedAt:
          type: string
          nullable: true
        cardsLinks:
          type: array
          items:
            $ref: '#/components/schemas/CardLink'
    DeckCreate:
      type: object
      required:
        - name
        - released
      properties:
        name:
          type: string
        released:
          type: boolean
    DeckList:
      type: object
      required:
        - countOfDecks
        - decks
      properties:
        countOfDecks:
          type: integer
          format: int32
        decks:
          type: array
          items:
            $ref: '#/components/schemas/Deck'
    DeckUpdate:
      type: object
      properties:
        name:
          type: string
        released:
          type: boolean
    EffectsCost:
      type: object
      required:
        - costType
      properties:
        prestate:
          type: string
        costType:
          type: string
        subtype:
          type: string
        supertype:
          type: string
        amount:
          type: integer
          format: int32
        target:
          $ref: '#/components/schemas/EffectsTarget'
        payment:
          $ref: '#/components/schemas/EffectsPayment'
        postCount:
          $ref: '#/components/schemas/PostCount'
    EffectsCount:
      type: object
      required:
        - multiplier
      properties:
        multiplier:
          type: integer
          format: int32
        target:
          $ref: '#/components/schemas/EffectsTarget'
    EffectsEffect:
      type: object
      required:
        - effectType
      properties:
        effectType:
          type: string
        subtype:
          type: string
        supertype:
          type: string
        amount:
          anyOf:
            - type: integer
              format: int32
            - $ref: '#/components/schemas/EffectsCount'
        maxAmount:
          type: integer
          format: int32
        target:
          $ref: '#/components/schemas/EffectsTarget'
        direction:
          type: string
        hindrance:
          type: string
        benefit:
          type: string
        chainEffect:
          $ref: '#/components/schemas/ChainEffect'
    EffectsPayment:
      type: object
      properties:
        paymentType:
          type: string
        amount:
          type: integer
          format: int32
        cardType:
          type: string
    EffectsTarget:
      type: object
      properties:
        cardType:
          type: string
        cardClass:
          type: string
        subtype:
          type: string
        minLevel:
          type: integer
          format: int32
        maxLevel:
          type: integer
          format: int32
        atk:
          type: integer
          format: int32
        def:
          type: integer
          format: int32
        zone:
          type: string
        targetType:
          type: string
        owner:
          type: string
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    Expansion:
      type: object
      required:
        - id
        - ownedId
        - name
        - releaseYear
        - isReleased
      properties:
        id:
          type: integer
          format: int32
        ownedId:
          type: integer
          format: int32
        name:
          type: string
        releaseYear:
          type: integer
          format: int32
        isReleased:
          type: boolean
    ExpansionList:
      type: object
      required:
        - countOfExpansions
        - expansions
      properties:
        countOfExpansions:
          type: integer
          format: int32
        expansions:
          type: array
          items:
            $ref: '#/components/schemas/Expansion'
    Format:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
    Image:
      type: object
      required:
        - id
        - status
        - generatedByUserId
        - generatedAt
      properties:
        id:
          type: integer
          format: int32
          description: use this id in backend to identify the generated assets
        status:
          type: string
          enum:
            - accepted
            - generated
            - queued
            - error
        generatedByUserId:
          type: integer
          format: int32
        generatedAt:
          type: string
    PostCount:
      type: object
      required:
        - countType
      properties:
        countType:
          type: string
        subtype:
          type: string
    Role:
      type: object
      required:
        - id
        - name
        - rights
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        rights:
          type: array
          items:
            $ref: '#/components/schemas/right'
        createdAt:
          type: string
        updatedAt:
          type: string
    RoleCreate:
      type: object
      required:
        - name
        - rights
      properties:
        name:
          type: string
        rights:
          type: array
          items:
            $ref: '#/components/schemas/right'
    RoleUpdate:
      type: object
      properties:
        name:
          type: string
        rights:
          type: array
          items:
            $ref: '#/components/schemas/right'
    TokenRequest:
      type: object
      required:
        - id
        - userId
        - createdAt
        - cardsInQueue
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        createdAt:
          type: string
        cardsInQueue:
          type: integer
          format: int32
    User:
      type: object
      required:
        - id
        - roleId
        - firstName
        - lastName
        - email
        - phoneNumber
        - active
        - tokens
        - tokenRequests
      properties:
        id:
          type: integer
          format: int32
        roleId:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        username:
          type: string
        penName:
          type: string
        active:
          type: boolean
        tokens:
          type: integer
          format: int32
        tokenRequests:
          type: array
          items:
            $ref: '#/components/schemas/TokenRequest'
    UserCreate:
      type: object
      required:
        - roleId
        - firstName
        - lastName
        - email
        - phoneNumber
        - tokens
      properties:
        roleId:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        username:
          type: string
        password:
          type: string
        penName:
          type: string
        sendPasswordEmail:
          type: boolean
        tokens:
          type: integer
          format: int32
    UserUpdate:
      type: object
      properties:
        roleId:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        username:
          type: string
        penName:
          type: string
        active:
          type: boolean
        tokens:
          type: integer
          format: int32
    right:
      type: string
      enum:
        - right1
        - right2
        - right3
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
servers:
  - url: https://example.com/api
    description: Server endpoint
    variables: {}
