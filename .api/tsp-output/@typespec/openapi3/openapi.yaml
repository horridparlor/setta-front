openapi: 3.0.0
info:
  title: Setta Backend
  version: 0.0.0
tags:
  - name: planned
paths:
  /roles:
    get:
      operationId: Roles_listRoles
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
      tags:
        - planned
    post:
      operationId: Roles_createRole
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
      tags:
        - planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
  /roles/{roleId}:
    get:
      operationId: Roles_getRole
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - planned
    post:
      operationId: Roles_updateRole
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
      tags:
        - planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
    delete:
      operationId: Roles_deleteRole
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - planned
  /token_requests:
    get:
      operationId: TokenRequests_listTokenRequests
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenRequest'
      tags:
        - planned
  /token_requests/{tokenRequestId}:
    delete:
      operationId: TokenRequests_deleteTokenRequest
      parameters:
        - name: tokenRequestId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - planned
  /user/cards:
    get:
      operationId: Cards_listCards
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardsResponse'
  /user/users:
    get:
      operationId: Users_listUsers
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
      tags:
        - planned
    post:
      operationId: Users_createUser
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /user/users/{userId}:
    get:
      operationId: Users_getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - planned
    patch:
      operationId: Users_updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
    delete:
      operationId: Users_deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - planned
security:
  - BearerAuth: []
components:
  schemas:
    Card:
      type: object
      required:
        - cardId
        - ownerId
        - ownerFirstname
        - ownerLastname
        - cardName
        - isAce
        - cardClass
        - cardType
        - subtype
        - supertype
        - maximumPiece
        - level
        - atk
        - def
        - costText
        - effectText
        - flavourText
        - artScale
        - artXOffset
        - artYOffset
        - nameSize
        - materialsSize
        - effectsSize
        - expansionId
        - originalExpansionId
        - createdAt
        - updatedAt
        - cardEffects
      properties:
        cardId:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        errataOfId:
          type: integer
          format: int32
        ownerFirstname:
          type: string
        ownerLastname:
          type: string
        cardName:
          type: string
        isAce:
          type: boolean
        cardClass:
          type: string
        cardType:
          type: string
        subtype:
          type: string
        supertype:
          type: string
        maximumPiece:
          type: string
        level:
          type: integer
          format: int32
        atk:
          type: integer
          format: int32
        def:
          type: integer
          format: int32
        primaryMaterialId:
          type: integer
          format: int32
        secondaryMaterialId:
          type: integer
          format: int32
        tertiaryMaterialId:
          type: integer
          format: int32
        materialsReminder:
          type: string
        costText:
          type: string
        effectText:
          type: string
        flavourText:
          type: string
        countsAsId:
          type: integer
          format: int32
        artScale:
          type: number
          format: float
        artXOffset:
          type: number
          format: float
        artYOffset:
          type: number
          format: float
        nameSize:
          type: number
          format: float
        materialsSize:
          type: number
          format: float
        effectsSize:
          type: number
          format: float
        expansionId:
          type: integer
          format: int32
        originalExpansionId:
          type: integer
          format: int32
        createdAt:
          type: string
        updatedAt:
          type: string
        cardEffects:
          $ref: '#/components/schemas/CardEffects'
    CardEffects:
      type: object
      required:
        - cost
        - effect
      properties:
        cost:
          $ref: '#/components/schemas/EffectsCost'
        effect:
          $ref: '#/components/schemas/EffectsEffect'
    CardsResponse:
      type: object
      required:
        - countOfCards
        - cards
      properties:
        countOfCards:
          type: integer
          format: int32
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
    ChainEffect:
      type: object
      required:
        - chainType
      properties:
        chainType:
          type: string
        subtype:
          type: string
        direction:
          type: string
        amount:
          type: integer
          format: int32
    EffectsCost:
      type: object
      required:
        - costType
      properties:
        prestate:
          type: string
        costType:
          type: string
        subtype:
          type: string
        supertype:
          type: string
        amount:
          type: integer
          format: int32
        target:
          $ref: '#/components/schemas/EffectsTarget'
        payment:
          $ref: '#/components/schemas/EffectsPayment'
        postCount:
          $ref: '#/components/schemas/PostCount'
    EffectsCount:
      type: object
      required:
        - multiplier
      properties:
        multiplier:
          type: integer
          format: int32
        target:
          $ref: '#/components/schemas/EffectsTarget'
    EffectsEffect:
      type: object
      required:
        - effectType
      properties:
        effectType:
          type: string
        subtype:
          type: string
        supertype:
          type: string
        amount:
          anyOf:
            - type: integer
              format: int32
            - $ref: '#/components/schemas/EffectsCount'
        maxAmount:
          type: integer
          format: int32
        target:
          $ref: '#/components/schemas/EffectsTarget'
        direction:
          type: string
        hindrance:
          type: string
        benefit:
          type: string
        chainEffect:
          $ref: '#/components/schemas/ChainEffect'
    EffectsPayment:
      type: object
      properties:
        paymentType:
          type: string
        amount:
          type: integer
          format: int32
        cardType:
          type: string
    EffectsTarget:
      type: object
      properties:
        cardType:
          type: string
        cardClass:
          type: string
        subtype:
          type: string
        minLevel:
          type: integer
          format: int32
        maxLevel:
          type: integer
          format: int32
        atk:
          type: integer
          format: int32
        def:
          type: integer
          format: int32
        zone:
          type: string
        targetType:
          type: string
        owner:
          type: string
    InternalServerError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INTERNAL_SERVER_ERROR
        message:
          type: string
    NotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - NOT_FOUND
        message:
          type: string
    PostCount:
      type: object
      required:
        - countType
      properties:
        countType:
          type: string
        subtype:
          type: string
    Role:
      type: object
      required:
        - id
        - name
        - rights
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        rights:
          type: array
          items:
            $ref: '#/components/schemas/right'
        createdAt:
          type: string
        updatedAt:
          type: string
    RoleCreate:
      type: object
      required:
        - name
        - rights
      properties:
        name:
          type: string
        rights:
          type: array
          items:
            $ref: '#/components/schemas/right'
    RoleUpdate:
      type: object
      properties:
        name:
          type: string
        rights:
          type: array
          items:
            $ref: '#/components/schemas/right'
    TokenRequest:
      type: object
      required:
        - id
        - userId
        - createdAt
        - cardsInQueue
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        createdAt:
          type: string
        cardsInQueue:
          type: integer
          format: int32
    User:
      type: object
      required:
        - id
        - roleId
        - firstName
        - lastName
        - email
        - phoneNumber
        - active
        - tokenRequests
      properties:
        id:
          type: integer
          format: int32
        roleId:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        username:
          type: string
        penName:
          type: string
        active:
          type: boolean
        tokenRequests:
          type: array
          items:
            $ref: '#/components/schemas/TokenRequest'
    UserCreate:
      type: object
      required:
        - roleId
        - firstName
        - lastName
        - email
        - phoneNumber
      properties:
        roleId:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        username:
          type: string
        password:
          type: string
        penName:
          type: string
        sendPasswordEmail:
          type: boolean
    UserUpdate:
      type: object
      properties:
        roleId:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        username:
          type: string
        penName:
          type: string
        active:
          type: boolean
    ValidationError:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items:
            type: string
    right:
      type: string
      enum:
        - right1
        - right2
        - right3
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
servers:
  - url: https://example.com/api
    description: Server endpoint
    variables: {}
