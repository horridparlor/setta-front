security:
  - BearerAuth: []
components:
  schemas:
    AccessRights:
      type: object
      properties:
        idAdmin:
          type: boolean
    AuthenticateRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    AuthenticateResponse:
      type: object
      required:
        - authToken
        - userId
        - firstname
        - lastname
        - accessRights
      properties:
        authToken:
          type: string
        userId:
          type: integer
          format: int32
        firstname:
          type: string
        lastname:
          type: string
        accessRights:
          $ref: '#/components/schemas/AccessRights'
    CardData:
      type: object
      required:
        - cardId
        - ownerId
        - ownerFirstname
        - ownerLastname
        - cardName
        - isAce
        - cardClass
        - cardType
        - subtype
        - supertype
        - maximumPiece
        - level
        - atk
        - def
        - costText
        - effectText
        - flavourText
        - artScale
        - artXOffset
        - artYOffset
        - nameSize
        - materialsSize
        - effectsSize
        - expansionId
        - originalExpansionId
        - createdAt
        - updatedAt
        - cardEffects
      properties:
        cardId:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        errataOfId:
          type: integer
          format: int32
        ownerFirstname:
          type: string
        ownerLastname:
          type: string
        cardName:
          type: string
        isAce:
          type: boolean
        cardClass:
          type: string
        cardType:
          type: string
        subtype:
          type: string
        supertype:
          type: string
        maximumPiece:
          type: string
        level:
          type: integer
          format: int32
        atk:
          type: integer
          format: int32
        def:
          type: integer
          format: int32
        primaryMaterialId:
          type: integer
          format: int32
        secondaryMaterialId:
          type: integer
          format: int32
        tertiaryMaterialId:
          type: integer
          format: int32
        materialsReminder:
          type: string
        costText:
          type: string
        effectText:
          type: string
        flavourText:
          type: string
        countsAsId:
          type: integer
          format: int32
        artScale:
          type: number
          format: float
        artXOffset:
          type: number
          format: float
        artYOffset:
          type: number
          format: float
        nameSize:
          type: number
          format: float
        materialsSize:
          type: number
          format: float
        effectsSize:
          type: number
          format: float
        expansionId:
          type: integer
          format: int32
        originalExpansionId:
          type: integer
          format: int32
        createdAt:
          type: string
        updatedAt:
          type: string
        cardEffects:
          $ref: '#/components/schemas/CardEffects'
    CardEffects:
      type: object
      required:
        - cost
        - effect
      properties:
        cost:
          $ref: '#/components/schemas/EffectsCost'
        effect:
          $ref: '#/components/schemas/EffectsEffect'
    CardExpansion:
      type: object
      required:
        - id
        - ownerId
        - name
        - releaseYear
        - isReleased
      properties:
        id:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        name:
          type: string
        releaseYear:
          type: integer
          format: int32
        isReleased:
          type: boolean
    ChainEffect:
      type: object
      required:
        - chainType
        - subtype
        - direction
        - amount
      properties:
        chainType:
          type: string
        subtype:
          type: string
          nullable: true
        direction:
          type: string
          nullable: true
        amount:
          type: integer
          format: int32
          nullable: true
    ChangePasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
    ChangePasswordResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    CopyCardRequest:
      type: object
      required:
        - cardId
        - serializedName
        - doErrata
      properties:
        cardId:
          type: integer
          format: int32
        serializedName:
          type: string
        doErrata:
          type: boolean
    CopyCardResponse:
      type: object
      required:
        - cardId
      properties:
        cardId:
          type: integer
          format: int32
    DeleteCardRequest:
      type: object
      required:
        - cardId
      properties:
        cardId:
          type: integer
          format: int32
    DeleteCardResponse:
      type: object
      required:
        - cardId
      properties:
        cardId:
          type: integer
          format: int32
    DeleteUserRequest:
      type: object
    DeleteUserResponse:
      type: object
    EffectsCost:
      type: object
      required:
        - prestate
        - costType
        - subtype
        - supertype
        - amount
        - target
        - payment
        - postCount
      properties:
        prestate:
          type: string
          nullable: true
        costType:
          type: string
        subtype:
          type: string
          nullable: true
        supertype:
          type: string
          nullable: true
        amount:
          type: integer
          format: int32
          nullable: true
        target:
          type: object
          allOf:
            - $ref: '#/components/schemas/EffectsTarget'
          nullable: true
        payment:
          type: object
          allOf:
            - $ref: '#/components/schemas/EffectsPayment'
          nullable: true
        postCount:
          type: object
          allOf:
            - $ref: '#/components/schemas/PostCount'
          nullable: true
    EffectsCount:
      type: object
      required:
        - multiplier
        - target
      properties:
        multiplier:
          type: integer
          format: int32
        target:
          type: object
          allOf:
            - $ref: '#/components/schemas/EffectsTarget'
          nullable: true
    EffectsEffect:
      type: object
      required:
        - effectType
        - subtype
        - supertype
        - amount
        - maxAmount
        - target
        - direction
        - hindrance
        - benefit
        - chainEffect
      properties:
        effectType:
          type: string
        subtype:
          type: string
          nullable: true
        supertype:
          type: string
          nullable: true
        amount:
          anyOf:
            - type: integer
              format: int32
            - $ref: '#/components/schemas/EffectsCount'
          nullable: true
        maxAmount:
          type: integer
          format: int32
          nullable: true
        target:
          type: object
          allOf:
            - $ref: '#/components/schemas/EffectsTarget'
          nullable: true
        direction:
          type: string
          nullable: true
        hindrance:
          type: string
          nullable: true
        benefit:
          type: string
          nullable: true
        chainEffect:
          type: object
          allOf:
            - $ref: '#/components/schemas/ChainEffect'
          nullable: true
    EffectsPayment:
      type: object
      required:
        - paymentType
        - amount
        - cardType
      properties:
        paymentType:
          type: string
          nullable: true
        amount:
          type: integer
          format: int32
          nullable: true
        cardType:
          type: string
          nullable: true
    EffectsTarget:
      type: object
      required:
        - cardType
        - cardClass
        - subtype
        - minLevel
        - maxLevel
        - atk
        - def
        - zone
        - targetType
        - owner
      properties:
        cardType:
          type: string
          nullable: true
        cardClass:
          type: string
          nullable: true
        subtype:
          type: string
          nullable: true
        minLevel:
          type: integer
          format: int32
          nullable: true
        maxLevel:
          type: integer
          format: int32
          nullable: true
        atk:
          type: integer
          format: int32
          nullable: true
        def:
          type: integer
          format: int32
          nullable: true
        zone:
          type: string
          nullable: true
        targetType:
          type: string
          nullable: true
        owner:
          type: string
          nullable: true
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    GetUserRequest:
      type: object
    GetUserResponse:
      type: object
    ListCardsResponse:
      type: object
      required:
        - countOfCards
        - cards
      properties:
        countOfCards:
          type: integer
          format: int32
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardData'
    ListExpansionsResponse:
      type: object
      required:
        - countOfExpansions
        - expansions
      properties:
        countOfExpansions:
          type: integer
          format: int32
        expansions:
          type: array
          items:
            $ref: '#/components/schemas/CardExpansion'
    ListUsersResponse:
      type: object
    PostCardRequest:
      type: object
      required:
        - cardName
        - serializedName
        - isAce
        - cardClass
        - cardType
        - subtype
        - supertype
        - maximumPiece
        - level
        - atk
        - def
        - primaryMaterialId
        - secondaryMaterialId
        - tertiaryMaterialId
        - materialsReminder
        - costText
        - effectText
        - flavourText
        - countsAsId
        - artScale
        - artXOffset
        - artYOffset
        - nameSize
        - materialsSize
        - effectsSize
        - expansionId
        - cardEffects
      properties:
        cardName:
          type: string
        serializedName:
          type: string
        isAce:
          type: boolean
        cardClass:
          type: string
        cardType:
          type: string
        subtype:
          type: string
        supertype:
          type: string
        maximumPiece:
          type: string
        level:
          type: integer
          format: int32
        atk:
          type: integer
          format: int32
        def:
          type: integer
          format: int32
        primaryMaterialId:
          type: integer
          format: int32
          nullable: true
        secondaryMaterialId:
          type: integer
          format: int32
          nullable: true
        tertiaryMaterialId:
          type: integer
          format: int32
          nullable: true
        materialsReminder:
          type: string
        costText:
          type: string
        effectText:
          type: string
        flavourText:
          type: string
        countsAsId:
          type: integer
          format: int32
          nullable: true
        artScale:
          type: integer
          format: int32
        artXOffset:
          type: integer
          format: int32
        artYOffset:
          type: integer
          format: int32
        nameSize:
          type: integer
          format: int32
        materialsSize:
          type: integer
          format: int32
        effectsSize:
          type: integer
          format: int32
        expansionId:
          type: integer
          format: int32
        cardEffects:
          $ref: '#/components/schemas/CardEffects'
    PostCardResponse:
      type: object
      required:
        - cardId
      properties:
        cardId:
          type: integer
          format: int32
    PostCount:
      type: object
      required:
        - countType
        - subtype
      properties:
        countType:
          type: string
        subtype:
          type: string
          nullable: true
    PostImageRequest:
      type: object
      required:
        - cardId
        - ownerId
        - imageName
        - artScale
        - artXOffset
        - artYOffset
        - base64String
      properties:
        cardId:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        imageName:
          type: string
        artScale:
          type: integer
          format: int32
        artXOffset:
          type: integer
          format: int32
        artYOffset:
          type: integer
          format: int32
        base64String:
          type: string
    PostImageResponse:
      type: object
      required:
        - imagePath
      properties:
        imagePath:
          type: string
    PostUserRequest:
      type: object
    PostUserResponse:
      type: object
    PutCardRequest:
      type: object
      required:
        - cardId
        - cardName
        - serializedName
        - isAce
        - cardClass
        - cardType
        - subtype
        - supertype
        - maximumPiece
        - level
        - atk
        - def
        - primaryMaterialId
        - secondaryMaterialId
        - tertiaryMaterialId
        - materialsReminder
        - costText
        - effectText
        - flavourText
        - countsAsId
        - artScale
        - artXOffset
        - artYOffset
        - nameSize
        - materialsSize
        - effectsSize
        - expansionId
        - cardEffects
      properties:
        cardId:
          type: integer
          format: int32
        cardName:
          type: string
        serializedName:
          type: string
        isAce:
          type: boolean
        cardClass:
          type: string
        cardType:
          type: string
        subtype:
          type: string
        supertype:
          type: string
        maximumPiece:
          type: string
        level:
          type: integer
          format: int32
        atk:
          type: integer
          format: int32
        def:
          type: integer
          format: int32
        primaryMaterialId:
          type: integer
          format: int32
          nullable: true
        secondaryMaterialId:
          type: integer
          format: int32
          nullable: true
        tertiaryMaterialId:
          type: integer
          format: int32
          nullable: true
        materialsReminder:
          type: string
        costText:
          type: string
        effectText:
          type: string
        flavourText:
          type: string
        countsAsId:
          type: integer
          format: int32
          nullable: true
        artScale:
          type: integer
          format: int32
        artXOffset:
          type: integer
          format: int32
        artYOffset:
          type: integer
          format: int32
        nameSize:
          type: integer
          format: int32
        materialsSize:
          type: integer
          format: int32
        effectsSize:
          type: integer
          format: int32
        expansionId:
          type: integer
          format: int32
        cardEffects:
          $ref: '#/components/schemas/CardEffects'
    PutCardResponse:
      type: object
      required:
        - cardId
      properties:
        cardId:
          type: integer
          format: int32
    PutUserRequest:
      type: object
    PutUserResponse:
      type: object
    Role:
      type: object
      required:
        - id
        - name
        - rights
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        rights:
          type: array
